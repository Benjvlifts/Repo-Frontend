name: Frontend CI Pipeline

on:
  push:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: innovatech-frontend-valdes-munoz
    steps:
    - uses: actions/checkout@v3
    - name: Use Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: innovatech-frontend-valdes-munoz/package-lock.json
    - name: Install dependencies
      run: npm install
    - name: Run Vitest
      run: npm run test -- --run